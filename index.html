<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<!-- Fetch the fonts the page uses straight away, so text doesn't wait on them -->
	<link rel="preload" href="fonts/univers-93-blackextended-webfont.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="fonts/crimson-pro-v24-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="fonts/crimson-pro-v24-latin-500.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="fonts/barlow-semi-condensed-v15-latin-200.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="fonts/barlow-semi-condensed-v15-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
	<link rel="mask-icon" href="icon/safari-pinned-tab.svg" color="#5bbad5">
	<!-- <link rel="manifest" href="site.webmanifest"> -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://www.puck-js.com/puck.js"></script>
	<meta name="msapplication-TileColor" content="#da532c">
	<meta name="theme-color" content="#0A192B">
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/tools.css">
	<script>
		var connection;
		var connectedTime;
		var userDisconnected = false;
		var reconnectTimer;
		// If set, called with each line from the watch. Returning true hides the line.
		// A handler clears this itself once it's had its line, so it can set up the next one.
		var lineHandler;
		let text = {
			connect: "Connect to watch",
			connecting: "Connecting...",
			connected: "Connected",
			disconnect: "Disconnect from watch",
			disconnected: "Disconnected",
			attempting: "Attempting to connect..."
		}

		// Code run on the watch by the tool buttons, sent with sendToWatch().
		// The watch runs each line as soon as its brackets are balanced, so a
		// statement can only continue onto the next line inside open brackets.
		let watchCommands = {
			// Send the names and sizes back as one JSON line, which onLine() formats as a listing
			showFiles: `
				let S = require('Storage'), f = S.list().sort().map(n => [n, (S.read(n)||'').length]);
				console.log('FILES:'+JSON.stringify({files: f, free: S.getFree ? S.getFree() : null}));
			`,
			// Blank flash reinstalls faster, as it doesn't need erasing first
			reinstall: `
				var f = require('Flash');
				var blank = f.read(4,0x60000000)==[255,255,255,255] && f.read(4,(245-80)*4096)==[255,255,255,255];
				console.log('Flash storage is '+(blank ? '' : 'not ')+'blank');
				console.log('Reinstalling files - this will take around '+(blank ? '50' : '80')+' seconds...');
				E.showMessage('Reinstalling...'); Bangle.setLCDPower(1); Bangle.setLCDBrightness(1);
				Bangle.factoryReset(0, blank);
			`,
			// Report any button that is already pressed (stuck), then light up each
			// button's area on screen once it has been pressed and released.
			// Passes when all four work, fails after 30 seconds, then reloads the clock.
			// bt: buttons, bs: state of each (1 pressed, 2 released, 3 both), bx/by: area on screen
			checkButtons: `
				clearWatch(); clearInterval(); clearTimeout();
				if (typeof(state)=='object') state.clockMode = null;
				Bangle.setLCDPower(1); Bangle.setLCDBrightness(1); Bangle.setLCDTimeout(0);
				var bt = [BTN1,BTN2,BTN3,BTN4], bs = [0,0,0,0], bx = [211,211,0,0], by = [10,141,141,10];
				var stuck = [];
				bt.forEach((b,i) => { if (b.read()) stuck.push('BTN'+(i+1)); });
				console.log(stuck.length ? 'STUCK BUTTONS: '+stuck.join(', ') : 'No stuck buttons - press and release each button');
				g.clear().setColor(-1).setFont('6x8',2).setFontAlign(0,0).drawString('Press each',120,110).drawString('button',120,130);
				var bd = i => {
					g.setColor(bs[i]==3 ? '#0F0' : bt[i].read() ? '#FF0' : '#444');
					g.fillRect(bx[i], by[i], bx[i]+29, by[i]+90);
				};
				bt.forEach((b,i) => bd(i));
				var bdone = (ok, r) => {
					clearWatch();
					clearTimeout(btT);
					console.log(r);
					g.setColor(-1).clearRect(31,100,209,140).drawString(ok ? 'Buttons OK' : 'Buttons FAIL', 120, 120);
					setTimeout(load, 3000);
				};
				var btT = setTimeout(_ => {
					let notWorking = bs.map((s,i) => s==3 ? 0 : 'BTN'+(i+1)).filter(x => x);
					bdone(0, 'BUTTON CHECK FAILED - not working: '+notWorking.join(', '));
				}, 30000);
				bt.forEach((b,i) => setWatch(e => {
					bs[i] |= e.state ? 1 : 2;
					bd(i);
					console.log('BTN'+(i+1)+(e.state ? ' pressed' : ' released'));
					if (bs.every(s => s==3)) bdone(1, 'All four buttons OK');
				}, b, {repeat: true, edge: 0, debounce: 25}));
			`
		}

		// Send code to the watch a line at a time. Starting each line with \x10
		// stops the watch echoing it back into the log.
		function sendToWatch(code) {
			code.split("\n").map(l => l.trim()).filter(l => l).forEach(l => connection.write("\x10"+l+"\n"));
		}

		// Write a file to the watch's storage a chunk at a time, then call done().
		// Characters above ASCII (like ° in factorytest.app.js) are sent as \xNN
		// escapes, so the watch stores each one as a single byte.
		// puck.js sends in 20 byte packets until it receives a longer packet from the
		// watch, then sends packets that size. So first have the watch send a line long
		// enough to fill a whole packet (onLine() hides it), and upload once it arrives.
		function uploadFile(name, data, done) {
			// Show a progress bar in the log, updated as each chunk is sent
			let bar = $('<span class="event"></span>');
			$("#received").append(timestamp()).append(bar).append("<br>");
			$("#received").stop().animate({ scrollTop: $('#received').prop("scrollHeight")}, 100);
			let startTime = Date.now();
			let num = n => n.toLocaleString("en-GB");
			let progress = sent => {
				let w = 30, f = Math.round(w*sent/data.length);
				let t = sent < data.length ? "" : ` in ${((Date.now()-startTime)/1000).toFixed(1)}s`;
				bar.text(`> [${"#".repeat(f)}${"-".repeat(w-f)}] ${Math.floor(100*sent/data.length)}%  ${num(sent)} / ${num(data.length)} bytes${t}`);
			};
			progress(0);
			lineHandler = l => {
				if (!l.startsWith("MTU:")) return false;
				lineHandler = undefined;
				startUpload(name, data, done, progress);
				return true;
			};
			connection.write("\x10console.log('MTU:'+'-'.repeat(250))\n");
		}

		function startUpload(name, data, done, progress) {
			let lit = s => JSON.stringify(s).replace(/[\u007f-\uffff]/g, c => {
				let n = c.charCodeAt(0);
				return n < 256 ? "\\x"+n.toString(16).padStart(2, "0") : "\\u"+n.toString(16).padStart(4, "0");
			});
			let chunkSize = 1024, offset = 0;
			let next = () => {
				progress(Math.min(offset, data.length));
				if (offset >= data.length) return done();
				let line = `\x10require('Storage').write(${lit(name)},${lit(data.substr(offset, chunkSize))},${offset},${data.length});\n`;
				offset += chunkSize;
				connection.write(line, next);
			};
			next();
		}

		// CRC32 of a string of bytes, matching the watch's E.CRC32()
		function crc32(s) {
			let crc = -1;
			for (let i = 0; i < s.length; i++) {
				crc ^= s.charCodeAt(i);
				for (let k = 0; k < 8; k++) crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
			}
			return (crc ^ -1) >>> 0;
		}

		// Escape text from the watch so it's shown as-is rather than read as HTML
		let esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

		// The current time as HH:MM:SS.mmm, to go at the start of each log line
		function timestamp() {
			let d = new Date();
			let pad = (n, w) => String(n).padStart(w || 2, "0");
			let t = pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+"."+pad(d.getMilliseconds(), 3);
			return `<span class="time">${t}</span> `;
		}

		// Format the FILES: line sent by "Show files on watch" as a directory listing
		function showFileList(json) {
			let d = JSON.parse(json);
			// File names can contain control characters (StorageFile chunks end in \x01)
			let names = d.files.map(f => f[0].replace(/[\x00-\x1f]/g, c => "\\"+c.charCodeAt(0)));
			let num = n => n.toLocaleString("en-GB");
			let total = d.files.reduce((t,f) => t+f[1], 0);
			let w = Math.max(20, ...names.map(n => n.length));
			let sw = Math.max(8, num(total).length);
			let lines = ["Files on watch:", ""];
			d.files.forEach((f,i) => lines.push("  "+names[i].padEnd(w)+"  "+num(f[1]).padStart(sw)+" bytes"));
			lines.push("  "+"-".repeat(w+sw+8));
			lines.push("  "+(d.files.length+" file"+(d.files.length==1?"":"s")).padEnd(w)+"  "+num(total).padStart(sw)+" bytes");
			if (d.free !== null) lines.push("  "+"Free".padEnd(w)+"  "+num(d.free).padStart(sw)+" bytes");
			$("#received").append(timestamp()+'<span class="listing">'+esc(lines.join("\n"))+"</span><br>");
		}

		// Add a line to the log for something done on the page, rather than sent by the watch
		function logEvent(t) {
			$("#received").append(timestamp()+`<span class="event">&gt; ${esc(t)}</span><br>`);
			$("#received").stop().animate({ scrollTop: $('#received').prop("scrollHeight")}, 100);
		}

		// Called when a line is received from the watch
		function onLine(v) {
			// console.log("Received: "+JSON.stringify(v));
			console.log("Received: "+v);
			if (lineHandler && lineHandler(v)) return;
			if (v.startsWith("FILES:")) {
				showFileList(v.substr(6));
				$("#received").stop().animate({ scrollTop: $('#received').prop("scrollHeight")}, 100);
				return;
			}
			// Highlight problems in red and successful checks in green
			let cls = "";
			if (/STUCK|FAIL|[Ee]rror|Uncaught|Interrupted|LOW_MEMORY/.test(v)) cls = "problem";
			else if (/\bOK\b(?!\?)|No stuck buttons/.test(v)) cls = "good";
			$("#received").append(timestamp()+(cls ? `<span class="${cls}">${esc(v)}</span>` : esc(v))+"<br>");
			// stop() any scroll still in progress, so scrolls don't queue up and lag behind
			$("#received").stop().animate({ scrollTop: $('#received').prop("scrollHeight")}, 100);
		}

		// Show the disconnected status and fade out the tool buttons
		function showDisconnected() {
			$("#status").html(text.disconnected);
			$('#connect').html(text.connect);
			$('#buttons').animate({opacity: 0}, 500, function() {
				$('#buttons').css("display", "none");
			});
		}

		// Connect to the watch
		function connect() {
			console.log("Connecting...");
			userDisconnected = false;
			$("#status").html(text.attempting);
			$('#connect').html(text.connecting);
			Puck.connect(function(c) {
				if (!c) {
					$("#status").html(text.disconnected);
					$('#connect').html(text.connect);
					return;
				}
				console.log("Connected! "+JSON.stringify(c));
				connection = c;
				connectedTime = new Date();
				$("#status").html(text.connected);
				$('#connect').html(text.disconnect);
				$('#buttons').css("display", "block");
				$('#buttons').animate({opacity: 1}, 500);
				$("#received").append("<br>"+new Date()+"<br>Connected to watch "+c.device.name+"<br>----------------------------------<br>");
				connection.on("close", function() {
					let connectedSeconds = Math.round((new Date() - connectedTime)/100)/10;
					console.log(`Disconnected after ${connectedSeconds} seconds`);
					if (connectedSeconds < 1 && !userDisconnected) {
						$("#status").html(text.attempting);
						reconnectTimer = setInterval(function() {
							console.log("Attempting to reconnect...");
							connection.reconnect(function(c) {
								if (!c) {
									console.log("Reconnect failed");
									return;
								}
								clearInterval(reconnectTimer);
								reconnectTimer = undefined;
								connection = c;
								connectedTime = new Date();
								$("#status").html(text.connected);
								$('#connect').html(text.disconnect);
							});
						}, 1000);
						return;
					}
					connection = undefined;
					showDisconnected();
				});
				// Handle the data we get back, and call 'onLine'
				// whenever we get a line
				var buf = "";
				connection.on("data", function(d) {
					buf += d;
					var i = buf.indexOf("\n");
					$("#receivePending").text(buf);
					while (i>=0) {
						onLine(buf.substr(0,i));
						buf = buf.substr(i+1);
						i = buf.indexOf("\n");
					}
				});
			});			
		}

		// Disconnect from the watch
		function disconnect() {
			console.log("Disconnecting...");
			if (reconnectTimer) clearInterval(reconnectTimer);
			reconnectTimer = undefined;
			userDisconnected = true;
			connection.close();
			connection = undefined;
			showDisconnected();
		}

		$(document).ready(function(){
			$("#status").html(text.disconnected);
			$('#connect').html(text.connect);
			$("body").animate({opacity: 1}, 500);
			// Web Bluetooth is only in Chromium browsers (and only over https or localhost),
			// so without it show a warning instead of letting Connect fail
			if (!navigator.bluetooth) {
				$("#noBluetooth").css("display", "block");
				$("#connect").prop("disabled", true);
			}
			// Log each button press. This is added before the buttons' own handlers so it
			// runs first, logging the press before any output and before the label changes.
			$("button").not("#copyLog").click(function(){
				logEvent(`Pressed "${$(this).text()}"`);
			});
			// Copy the log as plain text, e.g. to paste into an email
			$("#copyLog").click(function(){
				navigator.clipboard.writeText($("#received")[0].innerText.trim()).then(() => {
					$(this).text("Copied");
				}, () => {
					$(this).text("Couldn't copy");
				}).then(() => setTimeout(() => $(this).text("Copy log"), 1500));
			});
		  	$("#connect").click(function(){
				if (connection) {
					disconnect();
				} else {
					connect();
				}
		  	});
			$("#reset").click(function(){
				connection.write("console.log('Resetting watch '+NRF.getAddress());\n")
				connection.write("reset();\n")
				setTimeout(_=>connection.write("load();\n"), 500);
		  	});				
		  	$("#showFiles").click(function(){
				console.log("Requesting files")
				sendToWatch(watchCommands.showFiles);
		  	});
			$("#reinstall").click(function(){
				console.log("Reinstalling watch files")
				sendToWatch(watchCommands.reinstall);
			});
			// The firmware's built-in copy of factorytest.app.js is v0.16, in which log()
			// calls itself recursively and runs the watch out of memory (LOW_MEMORY,MEMORY).
			// So install v0.18 from js/factorytest.app.js (apps/factorytest/factorytest.js
			// in the DickensApps repo) before running it. "Reinstall watch files" puts
			// v0.16 back until the firmware is rebuilt with an up-to-date storage image
			// (dickens_storage_default.c).
		  	$("#runTests").click(function(){
				console.log("Installing factory tests");
				fetch("js/factorytest.app.js").then(r => {
					if (!r.ok) throw new Error(r.status+" "+r.statusText);
					return r.text();
				}).then(code => {
					let run = () => {
						// Update the version in factorytest.info (keeping any other fields
						// already there) so the launcher and App Loader don't still show 0.16
						connection.write("\x10var S=require('Storage');S.writeJSON('factorytest.info',Object.assign({id:'factorytest',name:'Factory test',src:'factorytest.app.js',icon:'factorytest.img',tags:'tool',sortorder:-9,files:'factorytest.info,factorytest.app.js,factorytest.img'},S.readJSON('factorytest.info',1),{version:'0.18'}));\n");
						console.log("Running tests");
						// load() already resets the interpreter before running the app
						connection.write("load('factorytest.app.js');\n");
					};
					// Compare the length and CRC of the watch's copy with ours, and
					// only upload it if they're different (or it isn't there)
					let want = code.length+","+crc32(code);
					lineHandler = l => {
						if (!l.startsWith("CRC:")) return false;
						lineHandler = undefined;
						// trim() removes the \r from the end of the watch's \r\n
						if (l.substr(4).trim() == want) {
							logEvent("factorytest.app.js v0.18 is already installed");
							run();
							return true;
						}
						logEvent(`Installing factorytest.app.js v0.18 (${code.length.toLocaleString("en-GB")} bytes)...`);
						uploadFile("factorytest.app.js", code, () => {
							connection.write("\x10console.log('Installed factorytest.app.js - '+require('Storage').read('factorytest.app.js').length+' bytes')\n");
							run();
						});
						return true;
					};
					connection.write("\x10var f=require('Storage').read('factorytest.app.js')||'';console.log('CRC:'+f.length+','+(E.CRC32(f)>>>0))\n");
				}).catch(e => logEvent("Couldn't load js/factorytest.app.js: "+e.message));
		  	});
			$("#checkButtons").click(function(){
				console.log("Checking buttons");
				sendToWatch(watchCommands.checkButtons);
			});
		});
	</script>
	<title>LPV6 watch tools</title>
</head>
<body>
	<div class="heading">
		STARFIELD WATCH TOOLS
	</div>
	<div class="smalltext">STATUS: <span id="status"></span></div>	
	<div id="noBluetooth">
		This browser doesn't support Web Bluetooth, so it can't connect to the watch.
		Please try again with Chrome, Edge or Opera.
	</div>
	<button id="connect"></button>
	<!-- <div class="subheading">
		Remove whitelist
	</div> -->
	<div id="buttons">
		<button id="reset">Reset watch</button>
		<button id="showFiles">Show files on watch</button>
		<button id="reinstall">Reinstall watch files</button>
		<button id="runTests">Run factory tests</button>
		<button id="checkButtons">Check watch buttons</button>
	</div>
	<div id="receivePending">
	</div>
	<div id="log">
		<div id="received">
		</div>
		<button id="copyLog">Copy log</button>
	</div>
</body>
</html>
